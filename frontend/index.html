<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B1E" />
    <meta name="description" content="Growth Tracker: clear your daily gate, keep your streak, rank up from E to S." />
    <title>Growth Tracker</title>
    <script>
      // Apply the saved colour mode before first paint so there is no flash of the wrong theme.
      try {
        var m = localStorage.getItem("gt-mode") || "dark";
        if (m === "system") m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mode", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
